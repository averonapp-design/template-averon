name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android, ios ou all"
        required: true
        default: all
      profile:
        description: "Perfil do EAS"
        required: true
        default: production
      env_json:
        description: "Variáveis de ambiente em JSON (injetadas pelo Lovable)"
        required: true
      expo_project_id:
        description: "Expo project id (opcional)"
        required: false
      no_wait:
        description: "Se 'true', dispara o build e sai imediatamente"
        required: true
        default: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      # Colocado logo antes do primeiro uso do env_json, e depois do step que
      # garante o jq. O repo e publico, e logs de Actions em repo publico sao
      # legiveis por qualquer um. O env_json chega como input de
      # workflow_dispatch, e inputs NAO sao mascarados automaticamente como
      # secrets: sem isto, cada valor aparece em texto puro no bloco "env:" de
      # todos os steps seguintes. Mascarando aqui, os demais mostram "***".
      - name: Mascarar valores do env_json
        env:
          ENV_JSON: ${{ inputs.env_json }}
        run: |
          set -euo pipefail
          printf '%s' "$ENV_JSON" > /tmp/env_json_raw
          # Mascara apenas valores de chaves sensiveis. Mascarar tudo deixaria
          # o log ilegivel (APP_NAME, bundle id e URL viram "***") sem ganho real.
          jq -r 'to_entries[]
                 | select(.key | test("KEY|TOKEN|SECRET|PASSWORD"; "i"))
                 | .value
                 | select(type == "string")
                 | select(length > 7)' /tmp/env_json_raw > /tmp/env_json_values
          while IFS= read -r value; do
            echo "::add-mask::$value"
          done < /tmp/env_json_values
          echo "Mascarados $(wc -l < /tmp/env_json_values) valores do env_json para o restante do job."

      - name: Exportar env vars do Lovable
        env:
          ENV_JSON: ${{ inputs.env_json }}
        run: |
          set -euo pipefail
          echo "$ENV_JSON" > env.json
          echo "$ENV_JSON" > .env.build
          echo "$ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Configurar Apple ASC API Key (iOS auto-credentials)
        if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
        env:
          # Passados via env (nunca interpolados no shell) para evitar injecao
          # e para que o GitHub mascare os valores automaticamente.
          # Suporta tanto APPLE_ASC_KEY_P8 quanto o typo APPLE_ASC_KEY_PR.
          ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          ASC_KEY_P8_FALLBACK: ${{ secrets.APPLE_ASC_KEY_PR }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail

          ASC_KEY_CONTENT="$ASC_KEY_P8"
          if [ -z "$ASC_KEY_CONTENT" ]; then
            ASC_KEY_CONTENT="$ASC_KEY_P8_FALLBACK"
          fi

          if [ -z "$ASC_KEY_CONTENT" ]; then
            echo "::error::Secret APPLE_ASC_KEY_P8 (ou APPLE_ASC_KEY_PR) nao esta definida."
            echo "::error::Sem a chave ASC o EAS nao consegue autenticar na Apple e o build iOS falha com 'Credentials are not set up'."
            exit 1
          fi

          mkdir -p /tmp/asc
          printf '%s' "$ASC_KEY_CONTENT" > /tmp/asc/AuthKey.p8
          chmod 600 /tmp/asc/AuthKey.p8

          if [ ! -s /tmp/asc/AuthKey.p8 ]; then
            echo "::error::Arquivo /tmp/asc/AuthKey.p8 ficou vazio apos a escrita."
            exit 1
          fi

          if ! grep -q "BEGIN PRIVATE KEY" /tmp/asc/AuthKey.p8; then
            echo "::error::A chave ASC nao parece um .p8 valido (falta o cabecalho '-----BEGIN PRIVATE KEY-----')."
            echo "::error::Cole o conteudo COMPLETO do arquivo .p8 na secret, incluindo as linhas BEGIN/END."
            exit 1
          fi

          MISSING=""
          if [ -z "$ASC_KEY_ID" ]; then MISSING="$MISSING APPLE_ASC_KEY_ID"; fi
          if [ -z "$ASC_ISSUER_ID" ]; then MISSING="$MISSING APPLE_ASC_ISSUER_ID"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Secrets obrigatorias ausentes:$MISSING"
            exit 1
          fi

          echo "Chave ASC validada ($(wc -c < /tmp/asc/AuthKey.p8) bytes)."
          echo "Lembrete: a chave precisa ter papel 'App Manager' ou 'Admin' no App Store Connect."
          echo "Uma chave com papel 'Developer' nao consegue criar Distribution Certificate."

          {
            echo "EXPO_ASC_API_KEY_PATH=/tmp/asc/AuthKey.p8"
            echo "EXPO_ASC_KEY_ID=$ASC_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "EXPO_APPLE_TEAM_ID=X7KA8A2UAW"
            echo "EXPO_APPLE_TEAM_TYPE=COMPANY_OR_ORGANIZATION"
          } >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: bun install

      - name: Build
        run: |
          if [ "${{ inputs.no_wait }}" = "true" ]; then
            echo "Disparando build com --no-wait..."
            eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
          else
            echo "Disparando build síncrono (aguardando conclusão)..."
            BUILD_FAILED=false
            eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --json > build-result.json || BUILD_FAILED=true
            cat build-result.json
            
            if [ -f build-result.json ] && jq empty build-result.json 2>/dev/null; then
              jq -c 'if type == "array" then . else [.] end' build-result.json > builds.json
              
              jq -c '.[]' builds.json | while read -r build; do
                PLATFORM=$(echo "$build" | jq -r '.platform | ascii_lowercase')
                STATUS=$(echo "$build" | jq -r '.status | ascii_upcase')
                EAS_BUILD_ID=$(echo "$build" | jq -r '.id')
                ARTIFACT_URL=$(echo "$build" | jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // ""')
                
                echo "Build concluded for $PLATFORM with status $STATUS."
                echo "EAS Build ID: $EAS_BUILD_ID"
                echo "Artifact URL: $ARTIFACT_URL"
                
                curl -X POST "$EXPO_PUBLIC_API_URL/expo-callback" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer $EXPO_PUBLIC_API_KEY" \
                  -d "{\"github_run_id\": \"$GITHUB_RUN_ID\", \"expo_build_id\": \"$EAS_BUILD_ID\", \"artifact_url\": \"$ARTIFACT_URL\", \"platform\": \"$PLATFORM\", \"status\": \"$STATUS\"}"
              done
            else
              echo "EAS build output JSON not found or invalid."
              curl -X POST "$EXPO_PUBLIC_API_URL/expo-callback" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $EXPO_PUBLIC_API_KEY" \
                -d "{\"github_run_id\": \"$GITHUB_RUN_ID\", \"status\": \"ERRORED\"}"
            fi
            
            if [ "$BUILD_FAILED" = "true" ]; then
              echo "EAS build failed."
              exit 1
            fi
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
